# Robinson's one-half conjecture (1947). Lean 4 v4.35.0 + Mathlib.
name = "RobinsonLean"
version = "0.1.0"
defaultTargets = ["Robinson"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Robinson"
# Robinson and every module under Robinson/ (so `lake build Robinson.Audit` works).
globs = ["Robinson", "Robinson.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
